name: CI

on:
  push:
    branches: ["main", "copilot/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  smoke-tests:
    name: Smoke tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify Python syntax
        run: |
          python -m py_compile plugins/python-debugger/skills/python-debugging/scripts/debugger.py
          python -m py_compile plugins/python-debugger/skills/python-debugging/scripts/inspector.py

      - name: Run smoke tests
        run: python -m pytest tests/test_smoke.py -v --tb=short
        timeout-minutes: 5

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            ~/.claude_debugger/
            /tmp/*.log
          if-no-files-found: ignore

  lint:
    name: Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install linter
        run: pip install pyflakes

      - name: Check for unused imports and undefined names
        run: |
          python -m pyflakes plugins/python-debugger/skills/python-debugging/scripts/debugger.py
          python -m pyflakes plugins/python-debugger/skills/python-debugging/scripts/inspector.py
